name: 印选 data.js 每日云端更新

# 已停用：职责由 daily-curated.yml 单一写者吸收（避免双 workflow 抢改 data.js）
# 保留文件仅作历史参考；如恢复请删除下行。
if: false

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00，每天跑一次
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行 build_daily_data.py（从 realtime.js 生成当日 data.js）
        run: python scripts/build_daily_data.py

      - name: 提交并推送（含冲突重试）
        run: |
          git config user.name "realtime-bot"
          git config user.email "bot@trendpick.local"
          git add js/data.js js/meta.js
          if git diff --cached --quiet; then
            echo "data.js 无变化，跳过提交"
          else
            git commit -m "daily(cloud): data.js 自动更新 $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "第 $i 次重试（remote 可能领先）..." && sleep 5
            done
            echo "推送失败，明天再试"
          fi
