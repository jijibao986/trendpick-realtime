name: 印选实时榜单更新

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行实时爬虫
        run: python scrape_realtime.py

      - name: 更新前端缓存版本号（防浏览器缓存旧 app.js/data.js）
        run: |
          TS=$(date +%Y%m%d%H%M)
          sed -i -E "s#js/(app|data)\.js([?]v=[0-9]+)?\"#js/\1.js?v=${TS}\"#g" index.html

      - name: 提交并推送
        run: |
          git config user.name "realtime-bot"
          git config user.email "bot@trendpick.local"
          git add realtime.js index.html
          git diff --cached --quiet && echo "内容无变化，跳过提交" || (git commit -m "realtime: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" && git push)
