name: 印选实时榜单更新

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行实时爬虫
        run: python scrape_realtime.py

      - name: 提交并推送（含冲突重试）
        run: |
          git config user.name "realtime-bot"
          git config user.email "bot@trendpick.local"
          git add realtime.js index.html
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "realtime: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "第 $i 次重试（remote 可能领先）..." && sleep 5
            done
            echo "推送失败，下个周期再试"
          fi
