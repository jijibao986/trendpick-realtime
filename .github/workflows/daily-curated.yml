name: 印选 Curated 每日云端精选

on:
  schedule:
    # UTC 1:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 防止极端情况下手动触发与定时重叠抢改 data.js
concurrency:
  group: trendpick-data-write
  cancel-in-progress: false

jobs:
  curated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ① 云端研究（纯脚本免Key）
        run: python scripts/cloud_curated.py

      - name: ② 合并 curated 事件到 data.js
        run: python scripts/merge_curated.py

      - name: ③ realtime top30 补强（复用已有脚本）
        run: python scripts/build_daily_data.py

      - name: ④ 配图 + 门禁（离线接图→在线抓缺→同类目兜底）
        run: python js/v2_build.py

      - name: ⑤ 写 meta.js（含 carried 标记）
        run: python scripts/write_meta.py

      - name: ⑥ 校验门禁（失败仅告警，不阻断发布）
        run: python scripts/validate.py || true

      - name: 提交并推送（含冲突重试）
        run: |
          git config user.name "realtime-bot"
          git config user.email "bot@trendpick.local"
          git add js/data.js js/meta.js img/real
          if git diff --cached --quiet; then
            echo "data.js 无变化，跳过提交"
          else
            git commit -m "curated(cloud): 每日精选更新 $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "第 $i 次重试（remote 可能领先）..." && sleep 5
            done
            echo "推送失败，明天再试"
          fi
